# JAXAtari-Viz Configuration File
# Unified run directories and scientific evaluation settings

ale_baselines_file: "/Users/kantoz/Research/legps/thesis/data/baselines.csv"

# Global algorithm color mappings for consistent graph visualization
algorithm_colors:
  legps: "#818cf8"         # Indigo
  ppo: "#34d399"           # Emerald
  ppo (pixels): "#34d399"  # Emerald
  ppo (oc): "#a78bfa"      # Purple
  ppo baseline: "#8b5cf6"  # Violet
  dqn: "#38bdf8"           # Sky Blue
  dqn (pixels): "#38bdf8"  # Sky Blue
  dqn (oc): "#2dd4bf"      # Teal
  dqn baseline: "#ec4899"  # Pink
  pqn: "#f59e0b"           # Amber
  pqn (pixels): "#f59e0b"  # Amber
  pqn (oc): "#fbbf24"      # Yellow Amber
  rainbow: "#f472b6"       # Pink Accent
  rainbow (pixels): "#f472b6"
  rainbow (oc): "#fb7185"  # Rose
  cma-es: "#fbbf24"        # Amber
  cmaes: "#fbbf24"
  blendrl: "#fb923c"       # Orange

# Default environment count configurations per algorithm
algorithm_default_envs:
  DQN: 1
  Rainbow: 1
  PPO: 8
  PQN: 128
  BlendRL: 64

projects:
  - name: "Thesis LLM Policy Search"
    runs_dir: "/Users/kantoz/Research/legps/thesis/runs_quentin"
    adapter: "cma_jsonl"
    backend: "jaxatari"
    obs_type: "oc"
    performance_metric: "ret_mean"
    primary_graphs: ["ret_mean", "best_fitness", "min_y_best"]
    color: "#818cf8"

  - name: "WandB Downloads"
    runs_dir: "/Users/kantoz/Research/legps/wandb_downloads"
    adapter: "wandb"
    backend: "jaxatari"
    obs_type: "pixels"
    performance_metric: "charts/episodic_return"
    primary_graphs: ["charts/episodic_return", "charts/avg_episodic_return", "losses/loss", "losses/q_values"]
    color: "#34d399"

server:
  host: "0.0.0.0"
  port: 8000
