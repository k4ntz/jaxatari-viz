    color: "#f472b6"

  - name: "WandB Rainbow OC"
    runs_dir: "/Users/kantoz/Research/legps/wandb_downloads/rainbow_oc"
    adapter: "wandb"
    backend: "jaxatari"
    obs_type: "oc"
